spring.application.name=portfolio-api
server.port=${PORT:8080}

# Paths are relative to api/, where ./mvnw runs.
portfolio.profile-path=${PROFILE_PATH:../profile/profile.json}
portfolio.prompt-path=${PROMPT_PATH:../prompts/system.md}
portfolio.allowed-origin=${ALLOWED_ORIGIN:http://localhost:5173}

# The key comes only from the environment (locally) or the host's secret store (deployed).
openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.base-url=${CHAT_BASE_URL:https://openrouter.ai/api/v1}
openrouter.model=${CHAT_MODEL:openai/gpt-4o-mini}
